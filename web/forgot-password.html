<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Reset Password · Sokovia</title>
  <link rel="icon" type="image/png" href="/favicon.png"/>
  <style>
    :root {
      --bg: #fbfbfd;
      --surface: #ffffff;
      --ink: #1d1d1f;
      --ink-2: #6e6e73;
      --ink-3: #86868b;
      --border: rgba(0, 0, 0, 0.08);
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
      --danger: #e02424;
      --saving: #18703a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font);
      font-size: 14.5px;
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px 20px;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 40px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.04);
      text-align: left;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      text-decoration: none;
      color: var(--ink);
      font-weight: 700;
      font-size: 18px;
      letter-spacing: -0.02em;
      margin-bottom: 24px;
    }
    .brand img { width: 24px; height: 24px; border-radius: 6px; }
    h1 {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }
    p.desc {
      color: var(--ink-2);
      font-size: 13.5px;
      margin-bottom: 22px;
      line-height: 1.5;
    }
    .input-group { margin-bottom: 16px; }
    .input-label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--ink-2);
      margin-bottom: 6px;
    }
    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }
    .text-input {
      width: 100%;
      height: 44px;
      padding: 0 14px;
      border: 1px solid rgba(0, 0, 0, 0.12);
      border-radius: 10px;
      font-size: 14px;
      font-family: inherit;
      background: #fbfbfb;
      outline: none;
      transition: all 0.15s;
    }
    .input-wrapper .text-input {
      padding-right: 42px;
    }
    .text-input:focus {
      border-color: #0071e3;
      background: #fff;
      box-shadow: 0 0 0 3px rgba(0, 113, 227, 0.12);
    }
    .pwd-toggle-btn {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--ink-3);
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .pwd-toggle-btn:hover { color: var(--ink); }
    .btn-pill {
      width: 100%;
      height: 44px;
      border-radius: 999px;
      font-size: 14.5px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: none;
      transition: all 0.15s;
      margin-top: 6px;
    }
    .btn-dark {
      background: #000;
      color: #fff;
    }
    .btn-dark:hover {
      background: #1d1d1f;
    }
    .btn-dark:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .error-msg {
      color: var(--danger);
      font-size: 12.5px;
      margin-top: 10px;
      display: none;
      line-height: 1.4;
    }
    .success-msg {
      color: var(--saving);
      font-size: 13px;
      margin-top: 10px;
      display: none;
      line-height: 1.4;
      background: #f0fdf4;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid rgba(24, 112, 58, 0.15);
    }
    .back-link {
      margin-top: 20px;
      text-align: center;
      font-size: 13px;
    }
    .back-link a {
      color: var(--ink-2);
      text-decoration: none;
    }
    .back-link a:hover {
      text-decoration: underline;
      color: var(--ink);
    }
    .otp-input {
      text-align: center;
      letter-spacing: 0.35em;
      font-size: 20px;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="card">
    <a href="/" class="brand">
      <img src="/favicon.png" alt="Sokovia"/>
      <span>sokovia</span>
    </a>

    <!-- STEP 1: Request Reset Code -->
    <div id="stepRequest">
      <h1>reset your password</h1>
      <p class="desc">
        Enter your registered email address. We'll send you a password reset verification code.
      </p>

      <form id="requestForm" onsubmit="handleSendReset(event)">
        <div class="input-group">
          <label class="input-label" for="resetEmail">email address</label>
          <input type="email" id="resetEmail" class="text-input" placeholder="you@domain.com" required autocomplete="email"/>
        </div>

        <button type="submit" id="sendBtn" class="btn-pill btn-dark">send reset code</button>
        <div id="requestError" class="error-msg"></div>
      </form>
    </div>

    <!-- STEP 2: Enter Code & New Password -->
    <div id="stepReset" style="display: none;">
      <h1>enter new password</h1>
      <p class="desc">
        We sent a verification code to <strong id="targetEmailLabel"></strong>. Enter the code and set your new password.
      </p>

      <form id="resetForm" onsubmit="handleCompleteReset(event)">
        <div class="input-group">
          <label class="input-label" for="resetCode">verification code</label>
          <input type="text" id="resetCode" class="text-input otp-input" maxlength="8" placeholder="123456" required autocomplete="one-time-code"/>
        </div>

        <div class="input-group">
          <label class="input-label" for="newPassword">new password</label>
          <div class="input-wrapper">
            <input type="password" id="newPassword" class="text-input" placeholder="minimum 6 characters" required minlength="6" autocomplete="new-password"/>
            <button type="button" class="pwd-toggle-btn" onclick="togglePwdVisibility('newPassword', this)">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" id="resetBtn" class="btn-pill btn-dark">update password</button>
        <div id="resetError" class="error-msg"></div>
        <div id="resetSuccess" class="success-msg"></div>
      </form>

      <div style="margin-top: 16px; text-align: center; font-size: 13px;">
        <button type="button" onclick="backToEmailStep()" style="background:none; border:none; color:var(--ink-2); cursor:pointer;">
          ← change email
        </button>
      </div>
    </div>

    <div class="back-link">
      <a href="/login">remember your password? sign in</a>
    </div>
  </div>

  <script src="/dist/index.js"></script>
  <script>
    let activeResetEmail = '';

    function togglePwdVisibility(id, btn) {
      const input = document.getElementById(id);
      if (!input) return;
      if (input.type === 'password') {
        input.type = 'text';
        btn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>';
      } else {
        input.type = 'password';
        btn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>';
      }
    }

    function backToEmailStep() {
      document.getElementById('stepReset').style.display = 'none';
      document.getElementById('stepRequest').style.display = 'block';
    }

    async function handleSendReset(e) {
      e.preventDefault();
      const emailInput = document.getElementById('resetEmail');
      const btn = document.getElementById('sendBtn');
      const errEl = document.getElementById('requestError');

      const email = emailInput ? emailInput.value.trim() : '';
      if (!email || !btn) return;

      activeResetEmail = email;
      errEl.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'sending code...';

      try {
        const client = window.insforge;
        if (!client) throw new Error('InsForge client not initialized');

        const { error } = await client.auth.sendResetPasswordEmail({
          email: email,
          redirectTo: window.location.origin + '/forgot-password'
        });

        if (error) throw error;

        document.getElementById('stepRequest').style.display = 'none';
        document.getElementById('targetEmailLabel').textContent = email;
        document.getElementById('stepReset').style.display = 'block';
        document.getElementById('resetCode').focus();
      } catch (err) {
        errEl.textContent = err.message || 'Failed to send reset code. Please check your email address.';
        errEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'send reset code';
      }
    }

    async function handleCompleteReset(e) {
      e.preventDefault();
      const codeInput = document.getElementById('resetCode');
      const pwdInput = document.getElementById('newPassword');
      const btn = document.getElementById('resetBtn');
      const errEl = document.getElementById('resetError');
      const succEl = document.getElementById('resetSuccess');

      const code = codeInput ? codeInput.value.trim() : '';
      const newPassword = pwdInput ? pwdInput.value : '';

      if (!code || !newPassword || !btn) return;
      if (newPassword.length < 6) {
        errEl.textContent = 'Password must be at least 6 characters.';
        errEl.style.display = 'block';
        return;
      }

      errEl.style.display = 'none';
      succEl.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'updating password...';

      try {
        const client = window.insforge;
        if (!client) throw new Error('InsForge client not initialized');

        // Exchange token or submit reset
        const exchangeRes = await client.auth.exchangeResetPasswordToken({
          email: activeResetEmail,
          code: code
        });

        const resetToken = exchangeRes.data && exchangeRes.data.token ? exchangeRes.data.token : code;

        const { error } = await client.auth.resetPassword({
          newPassword: newPassword,
          otp: resetToken
        });

        if (error) throw error;

        succEl.textContent = '✓ Password updated successfully! Redirecting to sign in...';
        succEl.style.display = 'block';

        setTimeout(() => {
          window.location.href = '/login';
        }, 1500);

      } catch (err) {
        errEl.textContent = err.message || 'Invalid or expired code. Please try again.';
        errEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'update password';
      }
    }
  </script>
</body>
</html>
