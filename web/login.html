<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Sign in to Sokovia</title>
  <link rel="icon" type="image/png" href="/favicon.png"/>
  <style>
    :root {
      --bg: #000000;
      --card-bg: #111112;
      --ink: #ffffff;
      --ink-2: #86868b;
      --ink-3: #515154;
      --border: rgba(255, 255, 255, 0.08);
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
      --btn-bg: #1c1c1e;
      --btn-hover: #2c2c2e;
      --input-bg: #161618;
      --input-border: rgba(255, 255, 255, 0.12);
      --input-focus: #0071e3;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }

    .login-container {
      width: 100%;
      max-width: 1140px;
      height: 680px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 32px;
      align-items: center;
    }

    /* LEFT SIDE: Testimonial Card */
    .testimonial-card {
      background: var(--card-bg);
      border-radius: 28px;
      height: 100%;
      border: 1px solid var(--border);
      padding: 60px 50px 40px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      position: relative;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
    }

    .testimonial-content {
      position: relative;
      z-index: 2;
    }

    .quote-text {
      font-size: 26px;
      font-weight: 500;
      letter-spacing: -0.02em;
      line-height: 1.35;
      color: #ffffff;
      margin-bottom: 24px;
      min-height: 70px;
      transition: opacity 0.3s ease;
    }

    .author-wrap {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 36px;
    }

    .author-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #2a2a2c;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 16px;
      overflow: hidden;
    }

    .author-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .author-name {
      font-size: 15px;
      font-weight: 600;
      color: #ffffff;
    }

    .author-handle {
      font-size: 13px;
      color: var(--ink-2);
    }

    .carousel-dots {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .carousel-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .carousel-dot.active {
      width: 22px;
      border-radius: 4px;
      background: #ffffff;
    }

    /* RIGHT SIDE: Auth Actions */
    .auth-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 40px;
      max-width: 420px;
      margin: 0 auto;
      width: 100%;
      text-align: center;
    }

    .brand-icon {
      width: 44px;
      height: 44px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand-icon img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    h1.auth-title {
      font-size: 26px;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }

    p.auth-subtitle {
      font-size: 14px;
      color: var(--ink-2);
      margin-bottom: 24px;
    }

    .signed-out-badge {
      font-size: 12px;
      color: var(--ink-2);
      margin-bottom: 20px;
      display: none;
    }

    /* OAuth Buttons Row */
    .oauth-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      width: 100%;
      margin-bottom: 22px;
    }

    .btn-oauth {
      height: 46px;
      background: var(--btn-bg);
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--ink);
      font-size: 14px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      font-family: inherit;
    }

    .btn-oauth:hover {
      background: var(--btn-hover);
      border-color: rgba(255, 255, 255, 0.16);
    }

    .btn-oauth svg {
      width: 18px;
      height: 18px;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 16px;
      width: 100%;
      margin-bottom: 22px;
      color: var(--ink-3);
      font-size: 12.5px;
    }

    .divider::before, .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* Form Fields */
    form.auth-form {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .input-wrapper {
      position: relative;
      width: 100%;
      display: flex;
      align-items: center;
    }

    .text-input {
      width: 100%;
      height: 48px;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 999px;
      padding: 0 20px;
      font-size: 14.5px;
      color: #ffffff;
      outline: none;
      font-family: inherit;
      transition: all 0.15s ease;
    }

    .text-input::placeholder {
      color: var(--ink-3);
    }

    .text-input:focus {
      border-color: var(--input-focus);
      box-shadow: 0 0 0 3px rgba(0, 113, 227, 0.25);
      background: #1a1a1d;
    }

    .input-wrapper .text-input.has-toggle {
      padding-right: 48px;
    }

    .pwd-toggle-btn {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--ink-2);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .pwd-toggle-btn:hover {
      color: #ffffff;
    }

    .btn-submit {
      width: 100%;
      height: 48px;
      border-radius: 999px;
      background: #ffffff;
      color: #000000;
      font-size: 14.5px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      font-family: inherit;
      transition: opacity 0.15s, transform 0.1s;
      margin-top: 4px;
    }

    .btn-submit:hover {
      opacity: 0.92;
    }

    .btn-submit:active {
      transform: scale(0.99);
    }

    .btn-submit:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .form-extras {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12.5px;
      margin-top: 2px;
      padding: 0 6px;
    }

    .form-extras button, .form-extras a {
      background: none;
      border: none;
      color: var(--ink-2);
      cursor: pointer;
      text-decoration: none;
      font-size: 12.5px;
    }

    .form-extras button:hover, .form-extras a:hover {
      color: #ffffff;
      text-decoration: underline;
    }

    .legal-footer {
      font-size: 12px;
      color: var(--ink-3);
      margin-top: 32px;
      line-height: 1.5;
    }

    .legal-footer a {
      color: var(--ink-2);
      text-decoration: underline;
    }

    .legal-footer a:hover {
      color: #ffffff;
    }

    .error-msg {
      color: #ff453a;
      font-size: 12.5px;
      margin-top: 8px;
      display: none;
      text-align: center;
    }

    .otp-input {
      letter-spacing: 0.35em;
      text-align: center;
      font-size: 18px;
    }

    @media (max-width: 860px) {
      .login-container {
        grid-template-columns: 1fr;
        height: auto;
      }
      .testimonial-card {
        display: none;
      }
      .auth-panel {
        padding: 40px 16px;
      }
    }
  </style>
</head>
<body>

  <div class="login-container">
    
    <!-- LEFT: Testimonial Carousel (Helumi style) -->
    <div class="testimonial-card">
      <div class="testimonial-content">
        <div class="quote-text" id="quoteText">Just downloaded! Loving it.</div>
        <div class="author-wrap">
          <div class="author-avatar" id="authorAvatar">N</div>
          <div>
            <div class="author-name" id="authorName">Nate</div>
            <div class="author-handle" id="authorHandle">𝕏 @ntgyc</div>
          </div>
        </div>
        <div class="carousel-dots" id="carouselDots">
          <!-- Dots dynamically generated -->
        </div>
      </div>
    </div>

    <!-- RIGHT: Sign In / Sign Up Panel -->
    <div class="auth-panel">
      <div class="brand-icon">
        <img src="/favicon.png" alt="Sokovia"/>
      </div>

      <h1 class="auth-title" id="authTitle">sign in to sokovia</h1>
      <p class="auth-subtitle" id="authSubtitle">welcome back.</p>

      <div class="signed-out-badge" id="signedOutBadge">you're signed out.</div>

      <!-- OAuth Buttons -->
      <div class="oauth-row">
        <button type="button" class="btn-oauth" onclick="signInWithGoogle()">
          <svg viewBox="0 0 24 24">
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          </svg>
          google
        </button>

        <button type="button" class="btn-oauth" onclick="signInWithApple()">
          <svg viewBox="0 0 24 24" fill="#ffffff">
            <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.42c.67-.82 1.13-1.96 1.01-3.1-.97.04-2.15.65-2.85 1.47-.61.71-1.14 1.86-1 2.98 1.09.08 2.19-.55 2.84-1.35z"/>
          </svg>
          apple
        </button>
      </div>

      <div class="divider">or</div>

      <!-- Main Email + Password Form -->
      <form class="auth-form" id="mainAuthForm" onsubmit="handleAuthSubmit(event)">
        
        <div class="input-wrapper" id="nameGroup" style="display: none;">
          <input type="text" id="authName" class="text-input" placeholder="your name" autocomplete="name"/>
        </div>

        <div class="input-wrapper">
          <input type="email" id="authEmail" class="text-input" placeholder="your email" required autocomplete="email"/>
        </div>

        <div class="input-wrapper" id="pwdGroup">
          <input type="password" id="authPassword" class="text-input has-toggle" placeholder="password" autocomplete="current-password"/>
          <button type="button" class="pwd-toggle-btn" onclick="togglePasswordVisibility()" title="Show/Hide password">
            <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>

        <div class="input-wrapper" id="otpGroup" style="display: none;">
          <input type="text" id="authOtp" class="text-input otp-input" maxlength="6" placeholder="123456" autocomplete="one-time-code"/>
        </div>

        <button type="submit" id="submitBtn" class="btn-submit">continue with email</button>
        
        <div class="form-extras">
          <button type="button" id="modeSwitchBtn" onclick="toggleAuthMode()">don't have an account? sign up</button>
          <a href="/forgot-password" id="forgotLink">forgot?</a>
        </div>

        <div id="authError" class="error-msg"></div>
      </form>

      <div class="legal-footer">
        by continuing you agree to the <a href="/terms">terms</a> and <a href="/privacy">privacy policy</a>.
      </div>
    </div>

  </div>

  <script src="/dist/index.js"></script>
  <script>
    // Testimonial Carousel Data
    const testimonials = [
      { text: "Just downloaded! Loving it.", name: "Nate", handle: "𝕏 @ntgyc" },
      { text: "Zero bytes on my MacBook disk, instant terabytes in Finder. Game changer.", name: "Alex Rivers", handle: "𝕏 @arivers_design" },
      { text: "Finally an Apple-grade cloud drive with real private R2 storage.", name: "Sarah Chen", handle: "𝕏 @sarahc_dev" },
      { text: "The native WebDAV speed is incredible. Opening 4K clips without caching lag.", name: "Marcus Brody", handle: "𝕏 @marcusb_filmmaker" },
      { text: "Clean, minimal, zero vibe-coded bloat. Exactly what macOS needed.", name: "David Kim", handle: "𝕏 @dkim_apple" }
    ];

    let currentTestimonialIndex = 0;
    function renderDots() {
      const container = document.getElementById('carouselDots');
      container.innerHTML = '';
      testimonials.forEach((_, idx) => {
        const dot = document.createElement('div');
        dot.className = 'carousel-dot' + (idx === currentTestimonialIndex ? ' active' : '');
        dot.onclick = () => setTestimonial(idx);
        container.appendChild(dot);
      });
    }

    function setTestimonial(idx) {
      currentTestimonialIndex = idx;
      const t = testimonials[idx];
      const quoteEl = document.getElementById('quoteText');
      quoteEl.style.opacity = '0';
      setTimeout(() => {
        quoteEl.textContent = t.text;
        document.getElementById('authorName').textContent = t.name;
        document.getElementById('authorHandle').textContent = t.handle;
        document.getElementById('authorAvatar').textContent = t.name[0];
        quoteEl.style.opacity = '1';
        renderDots();
      }, 200);
    }

    setInterval(() => {
      setTestimonial((currentTestimonialIndex + 1) % testimonials.length);
    }, 4500);
    renderDots();

    // Check signed_out param
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('signed_out') === '1') {
      document.getElementById('signedOutBadge').style.display = 'block';
    }

    // Toggle Sign In vs Sign Up
    let isSignUp = false;
    function toggleAuthMode() {
      isSignUp = !isSignUp;
      const title = document.getElementById('authTitle');
      const subtitle = document.getElementById('authSubtitle');
      const nameGroup = document.getElementById('nameGroup');
      const submitBtn = document.getElementById('submitBtn');
      const modeBtn = document.getElementById('modeSwitchBtn');
      const forgotLink = document.getElementById('forgotLink');

      if (isSignUp) {
        title.textContent = 'create your account';
        subtitle.textContent = 'get your private macOS cloud drive.';
        nameGroup.style.display = 'flex';
        submitBtn.textContent = 'create account';
        modeBtn.textContent = 'already have an account? sign in';
        forgotLink.style.display = 'none';
      } else {
        title.textContent = 'sign in to sokovia';
        subtitle.textContent = 'welcome back.';
        nameGroup.style.display = 'none';
        submitBtn.textContent = 'continue with email';
        modeBtn.textContent = "don't have an account? sign up";
        forgotLink.style.display = 'inline';
      }
    }

    function togglePasswordVisibility() {
      const pwd = document.getElementById('authPassword');
      const eye = document.getElementById('eyeIcon');
      if (pwd.type === 'password') {
        pwd.type = 'text';
        eye.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';
      } else {
        pwd.type = 'password';
        eye.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
      }
    }

    async function signInWithGoogle() {
      try {
        const client = window.insforge;
        if (!client) throw new Error('InsForge client not ready');
        await client.auth.signInWithOAuth('google', {
          redirectTo: window.location.origin + '/dashboard'
        });
      } catch (err) {
        alert(err.message || 'Google sign-in error');
      }
    }

    function signInWithApple() {
      alert('Apple ID sign-in is configuring for macOS Native. Please sign in with Google or Email.');
    }

    async function handleAuthSubmit(e) {
      e.preventDefault();
      const emailInput = document.getElementById('authEmail');
      const pwdInput = document.getElementById('authPassword');
      const nameInput = document.getElementById('authName');
      const btn = document.getElementById('submitBtn');
      const errEl = document.getElementById('authError');

      const email = emailInput ? emailInput.value.trim() : '';
      const password = pwdInput ? pwdInput.value : '';
      const name = nameInput ? nameInput.value.trim() : '';

      if (!email || !btn) return;

      if (!password || password.length < 6) {
        errEl.textContent = 'Password must be at least 6 characters.';
        errEl.style.display = 'block';
        return;
      }

      errEl.style.display = 'none';
      btn.disabled = true;

      try {
        const client = window.insforge;
        if (!client) throw new Error('InsForge client not initialized');

        if (isSignUp) {
          btn.textContent = 'creating account...';
          const { data, error } = await client.auth.signUp({
            email,
            password,
            name: name || undefined
          });
          if (error) throw error;

          const userObj = data && data.user ? data.user : { email, name };
          localStorage.setItem('sokovia_session', JSON.stringify({ email, name, user: userObj }));
          document.cookie = "sokovia_user=" + encodeURIComponent(email) + "; path=/; max-age=86400; SameSite=Lax";

          // Auto-provision bucket
          try {
            await fetch('https://26u7vqfh.function2.insforge.app/provision-user-bucket', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ email, displayName: name })
            });
          } catch(bErr) {}

          window.location.href = '/dashboard?email=' + encodeURIComponent(email);

        } else {
          btn.textContent = 'signing in...';
          const { data, error } = await client.auth.signInWithPassword({
            email,
            password
          });
          if (error) throw error;

          const userObj = data && data.user ? data.user : { email, name: (data?.user as any)?.name || '' };
          localStorage.setItem('sokovia_session', JSON.stringify({ email, name: userObj.name || '', user: userObj }));
          document.cookie = "sokovia_user=" + encodeURIComponent(email) + "; path=/; max-age=86400; SameSite=Lax";

          window.location.href = '/dashboard?email=' + encodeURIComponent(email);
        }

      } catch (err) {
        errEl.textContent = err.message || (isSignUp ? 'Sign up failed.' : 'Invalid email or password.');
        errEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = isSignUp ? 'create account' : 'continue with email';
      }
    }
  </script>
</body>
</html>
